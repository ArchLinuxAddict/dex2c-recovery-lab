name: validate-examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolkit v1.0.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/ArchLinuxAddict/dex2c-recovery-toolkit.git@v1.0.0"
      - name: Validate lab metadata
        run: python scripts/validate_lab.py
      - name: Basic DEX example
        run: python examples/basic-dex-analysis/run.py --check
      - name: Validation example
        run: python examples/validation/run.py --check
      - name: Synthetic APK pipeline example
        run: python examples/synthetic-apk-pipeline/run.py --check
